server:
  port: 8080

spring:
  application:
    name: driving-exam-houduan
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/driving_exam?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

logging:
  level:
    com.honmen.drivingexam: info
